<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oyunlar — Noir Pixel Games</title>
<meta name="description" content="Noir Pixel Games oyunları: ön kayıttaki, kapalı testteki ve yapımdaki tüm projeler.">
<meta name="theme-color" content="#1c1d21">
<link rel="icon" href="kit/favicon_32.png"><link rel="apple-touch-icon" href="kit/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="v2.css">
</head>
<body data-page="oyunlar">
<main>
  <section class="section" style="padding-top:clamp(140px,20vh,220px)">
    <div class="wrap">
      <div class="head split">
        <div><span class="label reveal">Katalog</span><h1 class="display reveal" style="margin-top:22px;font-size:clamp(56px,9vw,140px)">Oyunlar</h1>
          <p class="lede reveal">Ön kayıtta, kapalı testte ve yapımda olan her proje. Bir oyuna dokun, yakından bak.</p></div>
        <div class="filters reveal" role="group" aria-label="Duruma göre filtrele">
          <button aria-pressed="true" data-f="all">Tümü</button><button aria-pressed="false" data-f="out">Yayında</button><button aria-pressed="false" data-f="live">Ön kayıt</button>
          <button aria-pressed="false" data-f="test">Kapalı test</button><button aria-pressed="false" data-f="dev">Yapımda</button>
        </div>
      </div>
      <div class="grid" id="katalog"></div>
    </div>
  </section>
</main>
<script src="data.js"></script>
<script src="layout.js"></script>
<script src="i18n.js"></script>
<script>
const k = document.getElementById('katalog');
const draw = f => { k.innerHTML = NP.GAMES.filter(g => f === 'all' || g.status === f || (f === 'test' && g.test) || (f === 'dev' && g.status === 'secret')).map(NP.card).join(''); NP.reveal(); };
document.querySelectorAll('.filters button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === b));
  const run = () => draw(b.dataset.f);
  document.startViewTransition ? document.startViewTransition(run) : run();
}));
draw('all');
</script>
</body>
</html>
